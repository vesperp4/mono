name: Bug report
description: Something is broken
labels: ['bug']
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - mainsite
        - portal
        - tv
        - repo-wide
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you saw it
      placeholder: local devcontainer, dev.vesperp4.com, prod
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
