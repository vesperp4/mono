name: mainsite-web Deploy

# Builds the Next.js frontend and uploads it to the infra-managed Azure Static
# Web App (mainsite-web-prod) using its deployment token. The SWA resource
# itself is provisioned in the infra repo (bicep/web.bicep), not here.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mainsite/web/**'
      - '.github/workflows/mainsite-web-deploy.yaml'
  workflow_dispatch:
  # Content-triggered rebuild: a Sanity GROQ-powered webhook (on publish of
  # post/event documents) POSTs to the GitHub repository dispatches API using a
  # fine-grained PAT, so publishing content redeploys the static site.
  repository_dispatch:
    types: [sanity-publish]

concurrency:
  group: mainsite-web-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest

    # Scoped to the azure-swa environment, which holds AZURE_STATIC_WEB_APPS_API_TOKEN
    # (mirrors azure-acr for the api build). No reviewer gate — trunk-based auto-deploy.
    environment: azure-swa

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TURBO_CACHE_DIR: .turbo
          # Sanity content is fetched at build time, so it is invisible to Turbo's
          # input hash. Without this, a content publish is a guaranteed cache hit
          # that replays a stale out/ and redeploys the previous site unchanged.
          TURBO_FORCE: ${{ github.event_name != 'push' }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # With skip_app_build, app_location is the folder that gets uploaded and
          # output_location is not applied, so this must point at the built export.
          app_location: apps/mainsite/web/out
          skip_app_build: true
