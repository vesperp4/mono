name: TV Packager Build

# Builds, pushes, and signs the tv-packager job image on a release tag, then
# opens a dev image-bump PR in the infra repo. Triggered by release-please tags.
on:
  push:
    tags:
      - "tv-packager-v*"

concurrency:
  group: tv-packager-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Azure OIDC login + cosign keyless signing

env:
  IMAGE_NAME: tv-packager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: azure-acr # OIDC subject must match the id-github-acr-push federated credential
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name and tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#tv-packager-v}"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.ACR_LOGIN_SERVER }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/tv/packager
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=tv-packager
          cache-to: type=gha,mode=max,scope=tv-packager

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image by digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  update-infra-dev:
    needs: build-and-push
    uses: ./.github/workflows/_update-infra.yaml
    with:
      image: tv-packager
      app_group: tv
      tag: ${{ needs.build-and-push.outputs.tag }}
      environment: dev
      auto_merge: true
    secrets:
      infra_app_id: ${{ secrets.INFRA_APP_ID }}
      infra_app_key: ${{ secrets.INFRA_APP_KEY }}
